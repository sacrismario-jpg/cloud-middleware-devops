services:

  app:
    image: cloud-middleware-lab:v3
    container_name: cloud-middleware-app
    restart: unless-stopped

    expose:
      - "8000"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - backend

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: cloud-middleware-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 64m
    cpus: 0.5
    pids_limit: 50

    networks:
      - backend

networks:
  backend:
    driver: bridge
